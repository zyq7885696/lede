name: OpenWrt-CI

on:
  # 只保留手动触发
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_openwrt:
    name: Build OpenWrt Firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker image prune -f
          sudo -E rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android
          sudo -E apt-mark hold grub-efi-amd64-signed
          sudo -E apt update
          sudo -E apt -y purge azure-cli* docker* ghc* zulu* llvm* firefox google* dotnet* powershell* openjdk* mysql* php* mongodb* dotnet* snap*
          sudo -E apt -y full-upgrade
          sudo -E apt -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E systemctl daemon-reload
          sudo -E apt -y autoremove --purge
          sudo -E apt clean
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: Checkout OpenWrt
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Add custom packages feed
        run: |
          # 添加第三方软件源
          echo 'src-git helloworld https://github.com/fw876/helloworld.git' >> feeds.conf.default
          echo 'src-git kenzo https://github.com/kenzok8/openwrt-packages.git' >> feeds.conf.default
          echo 'src-git small https://github.com/kenzok8/small.git' >> feeds.conf.default

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate configuration file
        run: |
          # 基础配置
          cat > .config << 'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_GENERIC=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_EXT4FS=n
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_IMAGEOPT=y
          CONFIG_VERSIONOPT=y
          CONFIG_VERSION_DIST="OpenWrt"
          CONFIG_VERSION_REPO="https://downloads.openwrt.org"
          CONFIG_KERNEL_BUILD_USER="builder"
          CONFIG_KERNEL_BUILD_DOMAIN="buildhost"
          
          # 基本软件包
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-compat=y
          
          # LuCI 主题
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-theme-argon=y
          
          # LuCI 应用程序 - 中文界面
          CONFIG_PACKAGE_luci-i18n-diskman-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-filemanager-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ddns-go-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-zerotier-zh-cn=y
          
          # 额外应用程序
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-zerotier=y
          CONFIG_PACKAGE_luci-app-ddns-go=y
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_luci-app-filemanager=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          
          # Docker 支持（可选，如需启用取消注释）
          # CONFIG_PACKAGE_luci-i18n-dockerman-zh-cn=y
          # CONFIG_PACKAGE_docker=y
          # CONFIG_PACKAGE_dockerd=y
          
          # 网络支持
          CONFIG_PACKAGE_kmod-tcp-bbr=y
          CONFIG_PACKAGE_kmod-tcp-bbr2=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          EOF
          
          # 如果需要包含 Docker，取消下面的注释
          # echo 'CONFIG_PACKAGE_luci-i18n-dockerman-zh-cn=y' >> .config
          # echo 'CONFIG_PACKAGE_docker=y' >> .config
          # echo 'CONFIG_PACKAGE_dockerd=y' >> .config
          
          make defconfig

      - name: Download Kucat theme packages
        run: |
          # 下载 Kucat 主题包
          mkdir -p files/etc/uci-defaults
          mkdir -p files/etc/kucat-packages
          
          echo "下载 Kucat 主题..."
          wget --no-check-certificate -q -O files/etc/kucat-packages/luci-theme-kucat.ipk \
              https://github.com/sirpdboy/luci-theme-kucat/releases/download/v3.3.0/luci-theme-kucat_3.3.0-r20260227_all.ipk || true
          
          wget --no-check-certificate -q -O files/etc/kucat-packages/luci-app-kucat-config.ipk \
              https://github.com/sirpdboy/luci-app-kucat-config/releases/download/v2.2.0/luci-app-kucat-config_2.2.0-r20260227_all.ipk || true
          
          wget --no-check-certificate -q -O files/etc/kucat-packages/luci-i18n-kucat-config-zh-cn.ipk \
              https://github.com/sirpdboy/luci-app-kucat-config/releases/download/v2.2.0/luci-i18n-kucat-config-zh-cn_0_all.ipk || true
          
          # 创建 Kucat 主题安装脚本
          cat << 'INSTALL_SCRIPT' > files/etc/uci-defaults/98-install-kucat
          #!/bin/sh
          # 安装 Kucat 主题包
          if [ -d "/etc/kucat-packages" ]; then
              cd /etc/kucat-packages
              for ipk in *.ipk; do
                  [ -f "$ipk" ] && opkg install "$ipk" 2>/dev/null
              done
          fi
          exit 0
          INSTALL_SCRIPT
          
          # 创建默认主题设置脚本
          cat << 'THEME_SCRIPT' > files/etc/uci-defaults/99-kucat-theme
          #!/bin/sh
          sleep 2
          if [ -d "/usr/lib/lua/luci/view/kucat" ] || [ -f "/usr/lib/lua/luci/view/theme/kucat" ]; then
              uci set luci.main.mediaurlbase='/luci-static/kucat'
              uci commit luci
          fi
          exit 0
          THEME_SCRIPT
          
          chmod +x files/etc/uci-defaults/98-install-kucat
          chmod +x files/etc/uci-defaults/99-kucat-theme
          
          echo "✅ Kucat 主题配置完成"

      - name: Download OpenClash kernel
        run: |
          # 下载 OpenClash 内核文件
          if grep -q "CONFIG_PACKAGE_luci-app-openclash=y" .config; then
              echo "下载 OpenClash 内核..."
              mkdir -p files/etc/openclash/core
              wget -qO- https://raw.githubusercontent.com/vernesong/OpenClash/core/master/meta/clash-linux-amd64-v1.tar.gz | tar xOvz > files/etc/openclash/core/clash_meta || true
              chmod +x files/etc/openclash/core/clash_meta 2>/dev/null || true
              wget -q https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat -O files/etc/openclash/GeoIP.dat || true
              wget -q https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat -O files/etc/openclash/GeoSite.dat || true
              echo "✅ OpenClash 内核下载完成"
          fi

      - name: Download packages
        run: |
          make download -j16
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "======================="
          echo "Space usage:"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin
          du -h --max-depth=1 ./build_dir
          du -h --max-depth=1 ./bin

      - name: Prepare artifact
        run: |
          mkdir -p ./artifact/package
          mkdir -p ./artifact/buildinfo
          rm -rf $(find ./bin/targets/ -type d -name "packages")
          cp -rf $(find ./bin/packages/ -type f -name "*.ipk") ./artifact/package/ 2>/dev/null || true
          cp -rf $(find ./bin/targets/ -type f -name "*.buildinfo" -o -name "*.manifest") ./artifact/buildinfo/ 2>/dev/null || true

      - name: Upload buildinfo
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_buildinfo
          path: ./artifact/buildinfo/

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_package
          path: ./artifact/package/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware
          path: ./bin/targets/
